<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Os Jabuticabos Radicais - Contato</title>
    <link rel="stylesheet" href="styles.css"> </head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="imagens/logo_jabuticabos.png" alt="Logo Os Jabuticabos Radicais">
            </a>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="albuns.html">Álbuns</a></li>
                <li><a href="contato.html" class="active">Contato</a></li> </ul>
        </nav>
    </header>

    <div class="breadcrumbs">Home > Contato</div>

    <main class="bloco">
        
        <aside class="sidebar">
            <h4 class="titulosidebar">A banda</h4>
            <div class="fotobanda">
                <img src="imagens/sidebar.jpg" alt="Foto da banda Os Jabuticabos Radicais">
            </div>
            <p class="textoaleatorio">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </aside>

        <section class="principal">
            
            <h1>Fale com a gente!</h1>
            
            <div class="formulariocontato">
                <form class="detalhesform">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
                    
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem para a banda" required></textarea>
                    
                    <button type="submit">Enviar Mensagem</button>

                    <p style="text-align: center; margin-top: 15px; font-style: italic; color: #888;">Formulário com nome, email e mensagem</p>
                </form>

            </div>

        </section>

    </main>

    <footer class="footer">
        jabuticabos@gmail.com - COPYRIGHT
    </footer>

</body>
</html>
